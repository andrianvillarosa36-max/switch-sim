<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Switch Sim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1 class="brand">Switch Sim</h1>
    </header>

    <!-- Network: topology canvas -->
    <section id="view-net" class="net">
      <div id="toolbar" class="toolbar" role="toolbar" aria-label="Network tools">
        <button id="add-switch" class="tool" type="button"><span class="ico" data-icon="switch"></span>Switch</button>
        <button id="add-pc" class="tool" type="button"><span class="ico" data-icon="pc"></span>PC</button>
        <button id="add-router" class="tool" type="button"><span class="ico" data-icon="router"></span>Router</button>
        <button id="tool-cable" class="tool" type="button" aria-pressed="false"><span class="ico" data-icon="cable"></span>Cable</button>
      </div>
      <div class="canvaswrap">
        <svg id="net" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Network topology">
          <g id="world">
            <g id="layer-links"></g>
            <g id="layer-devs"></g>
            <g id="layer-fx"></g>
          </g>
        </svg>
        <div class="canvastools">
          <button id="net-replay" class="ghost" type="button" hidden>Replay</button>
          <button id="net-fit" class="ghost" type="button">Fit</button>
          <button id="net-clear" class="ghost" type="button">Clear</button>
        </div>
      </div>
      <div id="netbar" class="netbar"></div>
      <div id="playbar" class="playbar" hidden>
        <span id="pstep" class="nbtitle"></span>
        <div id="plines" class="plines"></div>
        <div class="pacts">
          <button id="p-prev" class="abtn" type="button">Back</button>
          <button id="p-play" class="abtn primary" type="button">Pause</button>
          <button id="p-next" class="abtn" type="button">Next</button>
          <button id="p-speed" class="abtn" type="button">1x</button>
          <button id="p-close" class="abtn" type="button">Close</button>
        </div>
      </div>
    </section>

    <!-- One device: switch console, or PC settings and command prompt -->
    <section id="view-console" class="consoleview" hidden>
      <div class="consolebar">
        <button id="console-back" class="ghost" type="button">Back</button>
        <span id="console-title" class="ctitle"></span>
        <button id="console-watch" class="ghost" type="button" hidden>Watch</button>
        <div id="pc-tabs" class="tabs" role="tablist" aria-label="PC screens" hidden>
          <button id="pc-tab-settings" type="button" role="tab" aria-selected="true">Settings</button>
          <button id="pc-tab-cmd" type="button" role="tab" aria-selected="false">Prompt</button>
        </div>
      </div>

      <form id="pc-settings" class="pcset" autocomplete="off" hidden>
        <label class="field"><span>IP address</span>
          <input id="pc-ip" type="text" inputmode="decimal" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="192.168.1.10">
        </label>
        <label class="field"><span>Subnet mask</span>
          <input id="pc-mask" type="text" inputmode="decimal" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="default for the address">
        </label>
        <label class="field"><span>Default gateway</span>
          <input id="pc-gw" type="text" inputmode="decimal" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="optional">
        </label>
        <p id="pc-msg" class="pcmsg" aria-live="polite"></p>
        <div class="pcact">
          <button type="submit" class="send">Save</button>
          <button id="pc-go" class="ghost" type="button">Open prompt</button>
        </div>
      </form>

      <div id="console-host" class="consolehost"></div>
    </section>
  </div>

  <script src="engine.js"></script>
  <script src="netsim.js"></script>
  <script src="pcshell.js"></script>
  <script src="router.js"></script>
  <script src="network.js"></script>
  <script src="terminal.js"></script>
  <script src="topology.js"></script>
  <script src="app.js"></script>
</body>
</html>
