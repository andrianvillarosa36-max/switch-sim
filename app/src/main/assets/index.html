<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Switch Sim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1 class="brand">Switch Sim</h1>
      <div class="tabs" role="tablist" aria-label="Sections">
        <button id="tab-net" type="button" role="tab" aria-selected="true" aria-controls="view-net">Network</button>
        <button id="tab-lab" type="button" role="tab" aria-selected="false" aria-controls="view-lab">Lesson</button>
        <button id="tab-quiz" type="button" role="tab" aria-selected="false" aria-controls="view-quiz">Quiz</button>
      </div>
    </header>

    <!-- Network: topology canvas -->
    <section id="view-net" class="net" role="tabpanel" aria-labelledby="tab-net">
      <div id="toolbar" class="toolbar" role="toolbar" aria-label="Network tools">
        <button id="add-switch" class="tool" type="button"><span class="ico" data-icon="switch"></span>Switch</button>
        <button id="add-pc" class="tool" type="button"><span class="ico" data-icon="pc"></span>PC</button>
        <button id="tool-cable" class="tool" type="button" aria-pressed="false"><span class="ico" data-icon="cable"></span>Cable</button>
      </div>
      <div class="canvaswrap">
        <svg id="net" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Network topology">
          <g id="world">
            <g id="layer-links"></g>
            <g id="layer-devs"></g>
          </g>
        </svg>
        <div class="canvastools">
          <button id="net-fit" class="ghost" type="button">Fit</button>
          <button id="net-clear" class="ghost" type="button">Clear</button>
        </div>
      </div>
      <div id="netbar" class="netbar"></div>
    </section>

    <!-- Network: one device's console -->
    <section id="view-console" class="consoleview" hidden>
      <div class="consolebar">
        <button id="console-back" class="ghost" type="button">Back</button>
        <span id="console-title" class="ctitle"></span>
      </div>
      <div id="console-host" class="consolehost"></div>
    </section>

    <!-- Lesson: guided lab on a single switch -->
    <section id="view-lab" class="lab" role="tabpanel" aria-labelledby="tab-lab" hidden>
      <div class="panel">
        <button id="taskbar" class="taskbar" type="button" aria-expanded="false" aria-controls="steps">
          <span class="leds" id="leds" aria-hidden="true"></span>
          <span class="tasktext">
            <span class="count" id="count"></span>
            <span class="task" id="task"></span>
          </span>
          <span class="chev" aria-hidden="true"></span>
        </button>
        <div id="steps" class="steps" hidden>
          <p class="mission" id="mission"></p>
          <ol id="steplist"></ol>
          <div class="steprow">
            <button id="hintbtn" class="ghost" type="button">Show hint</button>
            <button id="lab-reset" class="ghost" type="button">Reset lab</button>
          </div>
          <p class="hint" id="hint" hidden></p>
        </div>
      </div>
      <div id="lab-host" class="consolehost"></div>
    </section>

    <!-- Quiz -->
    <section id="view-quiz" class="view" role="tabpanel" aria-labelledby="tab-quiz" hidden>
      <h2 id="quiz-title">Quiz</h2>
      <p class="lede">Pick one answer for each question, then check.</p>
      <div id="quiz-list"></div>
      <div class="quizbar">
        <button id="check" class="send" type="button">Check answers</button>
        <span id="score" class="score" aria-live="polite"></span>
      </div>
    </section>
  </div>

  <script src="engine.js"></script>
  <script src="network.js"></script>
  <script src="lesson1.js"></script>
  <script src="terminal.js"></script>
  <script src="topology.js"></script>
  <script src="app.js"></script>
</body>
</html>
